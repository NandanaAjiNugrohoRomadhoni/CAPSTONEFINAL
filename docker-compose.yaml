# ═══════════════════════════════════════════════════════════
# Docker Compose — Capstone
# ═══════════════════════════════════════════════════════════
#
# DUA MODE:
#
#   Mode lokal (DB + Adminer otomatis):
#     docker compose --profile local up
#
#   Mode remote (DB eksternal, tanpa Adminer):
#     docker compose up
#
# Ubah kredensial/port di file .env (satu tempat).
# ═══════════════════════════════════════════════════════════

services:
  # ── App: PHP + Caddy (FrankenPHP) ───────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:${APP_PORT}
    container_name: capstone-app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:${APP_INTERNAL_PORT}"
    environment:
      # Buat entrypoint.sh (nama sederhana tanpa titik)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_INTERNAL_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # Buat CodeIgniter (dot-notation)
      CI_ENVIRONMENT: production
      app.baseURL: ${APP_BASE_URL}
      database.default.hostname: ${DB_HOST}
      database.default.database: ${DB_NAME}
      database.default.username: ${DB_USER}
      database.default.password: ${DB_PASS}
      database.default.DBDriver: ${DB_DRIVER}
      database.default.port: ${DB_INTERNAL_PORT}
    volumes:
      - app-writable:/app/writable

  # ── Database lokal (profil: local) ──────────────────────
  db:
    profiles: ["local"]
    image: ${DB_IMAGE}
    container_name: capstone-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:${DB_INTERNAL_PORT}"
    volumes:
      - db-data:/var/lib/mysql:Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Adminer (profil: local) ─────────────────────────────
  adminer:
    profiles: ["local"]
    image: docker.io/library/adminer:latest
    container_name: capstone-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:${ADMINER_INTERNAL_PORT}"

volumes:
  db-data:
  app-writable:
